services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: phasely
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: phasely
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phasely -d phasely"]
      interval: 2s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  celery:
    build: .
    command: uv run celery -A app.celery:celery_app worker --loglevel=info
    environment:
      UV_PROJECT_ENVIRONMENT: /venv
    volumes:
      - .:/app
    depends_on:
      - postgres
      - redis
    env_file:
      - .env.docker

  celery-beat:
    build: .
    command: uv run celery -A app.celery:celery_app beat --loglevel=info --schedule /tmp/celerybeat-schedule
    environment:
      UV_PROJECT_ENVIRONMENT: /venv
    volumes:
      - .:/app
    depends_on:
      - redis
    env_file:
      - .env.docker

  # Only started with `docker compose --profile demo up`; day to day the API runs
  # locally (uv run uvicorn) so it can be debugged in VS Code
  api:
    profiles: ["demo"]
    build: .
    command: sh -c "uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      UV_PROJECT_ENVIRONMENT: /venv
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env.docker

volumes:
  postgres_data:
