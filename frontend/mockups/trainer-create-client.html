<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phasely — Add Client</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background-color: #cdddd6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      width: 480px;
      padding: 60px 60px 50px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 700;
      color: #3d3d3d;
      margin-bottom: 10px;
    }

    .underline {
      width: 200px;
      height: 4px;
      background-color: #e8c96a;
      border-radius: 2px;
      margin-bottom: 48px;
    }

    .form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    input, textarea {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1.5px solid #8aada0;
      padding: 10px 0;
      font-size: 1.1rem;
      color: #9ab5ad;
      outline: none;
      text-align: center;
      font-family: inherit;
      resize: none;
    }

    input::placeholder, textarea::placeholder {
      color: #9ab5ad;
      font-size: 1.1rem;
    }

    input:focus, textarea:focus {
      border-bottom-color: #3d3d3d;
      color: #3d3d3d;
    }

    .row {
      display: flex;
      gap: 24px;
    }

    .row .input-group {
      flex: 1;
    }

    .btn {
      margin-top: 16px;
      width: 100%;
      padding: 18px;
      background-color: #e8c96a;
      border: none;
      border-radius: 14px;
      font-size: 1.2rem;
      font-weight: 700;
      color: white;
      cursor: pointer;
    }

    .btn:hover { background-color: #deba55; }

    .note {
      margin-top: 20px;
      font-size: 0.85rem;
      color: #6a9088;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Add Client</h1>
    <div class="underline"></div>
    <div class="form">

      <div class="row">
        <div class="input-group">
          <input type="text" placeholder="First name" />
        </div>
        <div class="input-group">
          <input type="text" placeholder="Last name" />
        </div>
      </div>

      <div class="input-group">
        <input type="email" placeholder="Email" />
      </div>

      <div class="input-group">
        <input type="password" placeholder="Temporary password" />
      </div>

      <div class="input-group">
        <input type="text" placeholder="Fitness goal (optional)" />
      </div>

      <button class="btn">Add client</button>
    </div>
    <p class="note">The client will be able to update their profile after first login.</p>
  </div>

</body>
</html>
