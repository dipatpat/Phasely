<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phasely — Register as Trainer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background-color: #eef5f2;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 20px;
      color: #3d3d3d;
    }

    /* LOGO */
    .logo {
      font-size: 2rem;
      font-weight: 800;
      color: #3d3d3d;
      margin-bottom: 32px;
      letter-spacing: -0.5px;
    }
    .logo span { color: #e8c96a; }

    /* CARD */
    .card {
      background: white;
      border-radius: 20px;
      padding: 40px 44px;
      width: 100%;
      max-width: 520px;
    }

    .card-title {
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .card-underline {
      width: 60px;
      height: 4px;
      background: #e8c96a;
      border-radius: 2px;
      margin-bottom: 32px;
    }

    /* SECTION LABEL */
    .section-label {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #8aada0;
      margin-bottom: 14px;
      margin-top: 24px;
    }

    .section-label:first-of-type { margin-top: 0; }

    /* FORM */
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .form-group { margin-bottom: 14px; }

    label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      color: #8aada0;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 7px;
    }

    .form-input {
      width: 100%;
      background: #f5faf8;
      border: none;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 0.92rem;
      color: #3d3d3d;
      outline: none;
      font-family: inherit;
      transition: background 0.15s;
    }

    .form-input:focus { background: #eaf2ee; }
    .form-input::placeholder { color: #b0c8c0; }

    textarea.form-input { resize: none; }

    select.form-input { cursor: pointer; }

    /* DIVIDER */
    .divider {
      height: 1px;
      background: #f0f5f3;
      margin: 24px 0;
    }

    /* SUBMIT */
    .btn-submit {
      width: 100%;
      background: #e8c96a;
      border: none;
      border-radius: 12px;
      padding: 15px;
      font-size: 1rem;
      font-weight: 700;
      color: white;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn-submit:hover { background: #deba55; }

    .login-link {
      text-align: center;
      margin-top: 20px;
      font-size: 0.85rem;
      color: #8aada0;
    }

    .login-link a {
      color: #3d3d3d;
      font-weight: 600;
      text-decoration: none;
    }

    .login-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="logo">Phase<span>ly</span></div>

  <div class="card">
    <div class="card-title">Register as Trainer</div>
    <div class="card-underline"></div>

    <!-- PERSONAL INFO -->
    <div class="section-label">Personal information</div>

    <div class="form-row">
      <div class="form-group">
        <label>First name</label>
        <input class="form-input" type="text" placeholder="e.g. Anna" />
      </div>
      <div class="form-group">
        <label>Last name</label>
        <input class="form-input" type="text" placeholder="e.g. Kowalska" />
      </div>
    </div>

    <div class="form-group">
      <label>Email</label>
      <input class="form-input" type="email" placeholder="your@email.com" />
    </div>

    <div class="divider"></div>

    <!-- PROFESSIONAL INFO -->
    <div class="section-label">Professional profile</div>

    <div class="form-group">
      <label>Specialization</label>
      <select class="form-input">
        <option value="" disabled selected>Select your specialization</option>
        <option>Strength & Conditioning</option>
        <option>Weight Loss</option>
        <option>Functional Fitness</option>
        <option>Yoga & Mobility</option>
        <option>Sports Performance</option>
        <option>Post-natal Fitness</option>
        <option>General Personal Training</option>
      </select>
    </div>

    <div class="form-group">
      <label>Bio <span style="text-transform:none; letter-spacing:0; font-weight:400; color:#b0c8c0;">(optional)</span></label>
      <textarea class="form-input" rows="3" placeholder="Tell clients a bit about yourself and your approach…"></textarea>
    </div>

    <div class="divider"></div>

    <!-- PASSWORD -->
    <div class="section-label">Security</div>

    <div class="form-row">
      <div class="form-group">
        <label>Password</label>
        <input class="form-input" type="password" placeholder="Min. 8 characters" />
      </div>
      <div class="form-group">
        <label>Confirm password</label>
        <input class="form-input" type="password" placeholder="Repeat password" />
      </div>
    </div>

    <button class="btn-submit" onclick="location.href='trainer-dashboard.html'">Create account →</button>

  </div>

  <div class="login-link">
    Already have an account? <a href="auth.html">Log in</a>
  </div>

</body>
</html>
