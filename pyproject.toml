[project]
name = "phasely"
version = "0.1.0"
description = "Cycle-aware fitness and nutrition platform"
authors = [
    {name = "Patrycja Szpakowska"}
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic-settings>=2.5.0",
    "redis>=5.0.0",
    "celery>=5.4.0",
    "python-multipart>=0.0.12",
    "greenlet>=3.5.0",
    "uuid6>=2025.0.1",
    "pyjwt>=2.13.0",
    "pwdlib[argon2]>=0.3.1",
    "pydantic[email]>=2.5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "pytest-mock>=3.14.0",
    "factory-boy>=3.3.0",
    "ruff>=0.9.0",
    "pre-commit>=4.0.0",
    "pytest-github-actions-annotate-failures>=0.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-v"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
ignore = ["B008"]
